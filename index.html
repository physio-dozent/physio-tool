<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physiotherapie Lerntool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Skill Lab — helles Design (Variante A: Petrol + Koralle)
   Schrift: Nunito (Überschriften) + Inter (Fließtext)
   ========================================================= */
:root {
  --brand: #0ea5a5;
  --brand-dark: #0b7d7d;
  --brand-soft: #d4f3f1;
  --accent: #ff6b5e;
  --accent-soft: #ffe3df;
  --bg: #f4f7f9;
  --card: #ffffff;
  --ink: #16232b;
  --ink-soft: #5a6b76;
  --ink-mute: #93a1aa;
  --line: #e6ecef;
  --ring-track: #e9eef1;
  --good: #16b364;
  --good-soft: #d6f5e4;
  --warn: #f5a524;
  --warn-soft: #fdefd8;
  --wrong: #e5484d;
  --wrong-soft: #fde7e7;
  --highlight: #ffe58a;
  --shadow: 0 1px 2px rgba(16,40,52,.04), 0 6px 20px rgba(16,40,52,.07);
  --shadow-lift: 0 2px 6px rgba(16,40,52,.08), 0 16px 40px rgba(16,40,52,.12);
  /* Themen-Akzentfarben */
  --t-schmerz: #a855f7;
  --t-knie: #0ea5a5;
  --t-fuss: #f5a524;
  --t-huefte: #ff6b5e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

.container { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }

h1, h2, h3 {
  font-family: 'Nunito', sans-serif;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--ink);
}
h1 { font-size: clamp(24px, 5vw, 30px); line-height: 1.2; margin-bottom: 4px; }
h2 { font-size: clamp(19px, 4vw, 23px); line-height: 1.25; margin-bottom: 12px; }
h3 { font-size: 17px; margin-bottom: 8px; }

.lead { color: var(--ink-soft); font-size: 15px; margin-bottom: 22px; }

.card {
  background: var(--card);
  border-radius: 18px;
  padding: 24px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
@media (max-width: 600px) {
  .card { padding: 18px; }
  .container { padding: 18px 12px 60px; }
}

/* App-Kopf */
.appbar { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.appbar .logo {
  width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
  display: grid; place-items: center; color: #fff;
  box-shadow: var(--shadow);
}
.brand-mark { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 20px; letter-spacing: -0.02em; }
.brand-sub { font-size: 11.5px; color: var(--ink-mute); font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; }
.avatar {
  margin-left: auto; width: 42px; height: 42px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-weight: 800; font-family: 'Nunito', sans-serif; font-size: 17px;
}

/* Abschnitts-Überschrift */
.section-h {
  font-size: 12.5px; font-weight: 800; color: var(--ink-mute);
  text-transform: uppercase; letter-spacing: 0.07em; margin: 24px 4px 12px;
  font-family: 'Nunito', sans-serif;
}

/* Formulare */
label {
  display: block; font-size: 13px; font-weight: 600; color: var(--ink-soft);
  margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em;
}
input[type="text"], input[type="date"], select, textarea {
  width: 100%; padding: 12px 14px;
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  font-family: inherit; font-size: 15px; color: var(--ink);
  transition: border-color 0.15s, box-shadow 0.15s;
}
input[type="text"]:focus, input[type="date"]:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(14,165,165,0.18);
}
textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
.field { margin-bottom: 18px; }
.class-hint { font-size: 12.5px; font-weight: 600; margin-top: 7px; line-height: 1.45; }
.class-hint.ok { color: var(--good); }
.class-hint.err { color: var(--wrong); }
.class-hint.info { color: var(--ink-soft); }
.label-opt { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink-mute); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 480px) { .field-row { grid-template-columns: 1fr; } }

/* Buttons */
button { font-family: inherit; }
.btn-primary, .btn-secondary {
  font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15.5px;
  padding: 13px 24px; border-radius: 13px; border: none; cursor: pointer;
  transition: transform 0.1s, filter 0.1s;
}
.btn-primary {
  background: var(--brand); color: #fff;
  box-shadow: 0 6px 16px rgba(14,165,165,0.35);
}
.btn-primary:hover { filter: brightness(1.06); }
.btn-primary:active { transform: scale(0.99); }
.btn-primary:disabled { background: var(--ink-mute); box-shadow: none; cursor: not-allowed; }
.btn-secondary {
  background: var(--card); color: var(--ink);
  border: 1.5px solid var(--line); box-shadow: var(--shadow);
}
.btn-secondary:hover { border-color: var(--brand); color: var(--brand-dark); }
.btn-ghost {
  background: transparent; border: none; color: var(--ink-soft);
  font-size: 14px; font-weight: 600; padding: 8px 12px; cursor: pointer; border-radius: 10px;
}
.btn-ghost:hover { color: var(--brand-dark); background: var(--brand-soft); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; align-items: center; }
.step-nav { justify-content: flex-end; }
.step-nav .btn-ghost { margin-right: auto; }

/* Hero (persönliche Startseite) */
.hero {
  background: linear-gradient(135deg, var(--brand), var(--brand-dark));
  color: #fff; border-radius: 20px; padding: 22px 22px 20px;
  box-shadow: var(--shadow-lift); margin-bottom: 16px;
  position: relative; overflow: hidden;
}
.hero::after {
  content: ''; position: absolute; right: -40px; top: -40px;
  width: 170px; height: 170px; border-radius: 50%;
  background: rgba(255,255,255,0.10);
}
.hero h1 { font-size: 24px; font-weight: 800; margin-bottom: 2px; color: #fff; }
.hero p { opacity: 0.92; font-size: 14px; }
.hero-stats { display: flex; gap: 10px; margin-top: 16px; position: relative; z-index: 1; }
.hstat { background: rgba(255,255,255,0.16); border-radius: 13px; padding: 11px 13px; flex: 1; }
.hstat .n { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 21px; line-height: 1.1; }
.hstat .l { font-size: 11px; opacity: 0.92; margin-top: 2px; }

/* Ringe */
.goal-row { display: flex; align-items: center; gap: 16px; }
.ringwrap { position: relative; flex-shrink: 0; }
.ringwrap .val {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px;
}
.goal-txt h3 { font-size: 16px; margin-bottom: 2px; }
.goal-txt p { font-size: 13.5px; color: var(--ink-soft); }

/* Themen-Karten */
.topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .topic-grid { grid-template-columns: 1fr; } }
.topic-card {
  background: var(--card); border-radius: 18px; padding: 16px;
  box-shadow: var(--shadow); cursor: pointer; border: 1.5px solid transparent;
  transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
}
.topic-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: var(--tc); }
.topic-card .ticon {
  width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--tc) 14%, #fff); color: var(--tc); margin-bottom: 12px;
}
.topic-card h3 { font-size: 16px; line-height: 1.25; margin-bottom: 2px; }
.topic-card .tmeta { font-size: 12.5px; color: var(--ink-mute); margin-bottom: 12px; }
.tbar { height: 7px; border-radius: 99px; background: var(--ring-track); overflow: hidden; }
.tbar > i { display: block; height: 100%; border-radius: 99px; background: var(--tc); }
.tpct { font-size: 12px; font-weight: 700; color: var(--tc); margin-top: 7px; display: block; }

.mixed-banner {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 14px;
  background: linear-gradient(120deg, var(--accent), #f0554a);
  color: #fff; border-radius: 18px; padding: 16px 18px; cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.12s;
}
.mixed-banner:hover { transform: translateY(-2px); }
.mixed-banner .em { font-size: 26px; }
.mixed-banner h3 { font-size: 16px; color: #fff; margin: 0; }
.mixed-banner p { font-size: 12.5px; opacity: 0.93; }
.mixed-banner .go { margin-left: auto; font-size: 20px; }

/* Empfehlungen */
.rec-list { display: flex; flex-direction: column; gap: 9px; }
.rec-chip {
  padding: 13px 15px; background: var(--card);
  border: 1.5px solid var(--line); border-left: 4px solid var(--brand);
  border-radius: 14px; cursor: pointer; box-shadow: var(--shadow);
  transition: border-color 0.12s, transform 0.12s;
}
.rec-chip:hover { border-color: var(--brand); transform: translateX(2px); }
.rec-title { font-weight: 700; font-size: 14.5px; font-family: 'Nunito', sans-serif; }
.rec-reason { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }

/* Verlauf */
.recent { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.recent-row { display: flex; gap: 12px; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
.recent-row:last-child { border-bottom: none; }
.recent-when { color: var(--ink-mute); font-size: 12.5px; min-width: 52px; }
.recent-title { flex-grow: 1; font-weight: 600; }
.recent-score { color: var(--brand-dark); font-weight: 800; font-family: 'Nunito', sans-serif; white-space: nowrap; }
.device-note { font-size: 12px; color: var(--ink-mute); margin-top: 14px; }

/* Einheiten-Liste (Thema-Ansicht) */
.unit-list { display: flex; flex-direction: column; gap: 11px; }
.lesson-row {
  display: flex; align-items: center; gap: 14px; background: var(--card);
  border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); cursor: pointer;
  border: 1.5px solid transparent; transition: border-color 0.12s, transform 0.12s;
}
.lesson-row:hover { border-color: var(--tc, var(--brand)); transform: translateX(2px); }
.lesson-row .l-ring { width: 46px; height: 46px; flex-shrink: 0; position: relative; }
.lesson-row .l-ring .val { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 800; font-family: 'Nunito', sans-serif; }
.lesson-row .l-check { width: 46px; height: 46px; border-radius: 50%; background: var(--good-soft); color: var(--good); display: grid; place-items: center; flex-shrink: 0; }
.lesson-row .l-body { flex: 1; min-width: 0; }
.lesson-row .l-body h3 { font-size: 15px; font-weight: 700; margin: 0; }
.lesson-row .l-body p { font-size: 12.5px; color: var(--ink-mute); }
.unit-tag {
  font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 99px;
  font-family: 'Nunito', sans-serif; flex-shrink: 0;
}
.unit-tag.type-quiz { background: var(--brand-soft); color: var(--brand-dark); }
.unit-tag.type-short_case { background: var(--warn-soft); color: #b45309; }
.unit-tag.type-reasoning_case { background: #ede9fe; color: #6d28d9; }
.unit-tag.tag-done { background: var(--good-soft); color: var(--good); }

.topic-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.topic-head .ticon { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; background: color-mix(in srgb, var(--tc, var(--brand)) 14%, #fff); color: var(--tc, var(--brand)); flex-shrink: 0; }
.topic-head h1 { margin-bottom: 0; }
.topic-head p { font-size: 13.5px; color: var(--ink-soft); }

.back {
  display: inline-flex; align-items: center; gap: 6px; background: none; border: none;
  color: var(--ink-soft); font-family: inherit; font-size: 14px; font-weight: 600;
  cursor: pointer; margin-bottom: 14px; padding: 6px 10px; border-radius: 10px;
}
.back:hover { color: var(--brand-dark); background: var(--brand-soft); }

/* Fortschrittsanzeige (oben im Quiz) */
.progress {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px; padding: 12px 16px;
  background: var(--card); border-radius: 14px; box-shadow: var(--shadow); gap: 14px;
}
.progress-text { font-size: 13px; color: var(--ink-soft); font-weight: 700; font-family: 'Nunito', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress-bar { height: 8px; background: var(--ring-track); border-radius: 99px; overflow: hidden; flex-grow: 1; }
.progress-fill { height: 100%; background: var(--brand); border-radius: 99px; transition: width 0.3s; }

/* Fragen */
.question { margin-bottom: 26px; padding-bottom: 4px; }
.question-num {
  font-size: 12.5px; color: var(--brand-dark); font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px;
  font-family: 'Nunito', sans-serif;
}
.question-text {
  font-size: 18px; font-weight: 700; margin-bottom: 18px; line-height: 1.4;
  font-family: 'Nunito', sans-serif;
}
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  display: flex; align-items: flex-start; gap: 12px; padding: 14px 15px;
  border: 2px solid var(--line); border-radius: 14px; cursor: pointer;
  transition: border-color 0.12s, background 0.12s; background: var(--card);
  box-shadow: var(--shadow);
  /* Label-Grundstil neutralisieren (.option ist ein <label>) */
  text-transform: none; letter-spacing: normal; font-size: 15px;
  font-weight: 400; color: var(--ink); margin-bottom: 0;
}
.option:hover { border-color: var(--brand); }
.option input[type="radio"], .option input[type="checkbox"] {
  margin-top: 3px; flex-shrink: 0; accent-color: var(--brand);
  width: 17px; height: 17px;
}
.option-text { flex-grow: 1; line-height: 1.45; }
.option.selected { border-color: var(--brand); background: var(--brand-soft); }
.option.correct { border-color: var(--good); background: var(--good-soft); }
.option.wrong { border-color: var(--wrong); background: var(--wrong-soft); }
.option.locked { cursor: default; box-shadow: none; }
.option.locked:hover { border-color: var(--line); }
.option.locked.correct, .option.locked.correct:hover { border-color: var(--good); }
.option.locked.wrong, .option.locked.wrong:hover { border-color: var(--wrong); }

.feedback { margin-top: 14px; padding: 14px 16px; border-radius: 14px; font-size: 14px; line-height: 1.55; }
.feedback.correct { background: var(--good-soft); color: #15803d; border-left: 4px solid var(--good); }
.feedback.wrong { background: var(--wrong-soft); color: #b42318; border-left: 4px solid var(--wrong); }
.feedback strong { display: block; margin-bottom: 4px; font-family: 'Nunito', sans-serif; font-weight: 800; }

/* Sicherheits-Einschätzung */
.conf-box { margin-top: 18px; }
.conf-label {
  font-size: 13px; font-weight: 800; color: var(--ink-soft); margin-bottom: 9px;
  font-family: 'Nunito', sans-serif; text-transform: uppercase; letter-spacing: 0.05em;
}
.conf-row { display: flex; gap: 9px; flex-wrap: wrap; }
.conf-btn {
  flex: 1; min-width: 100px; padding: 12px 10px;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 13px;
  font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; color: var(--ink);
  cursor: pointer; box-shadow: var(--shadow);
  transition: border-color 0.12s, background 0.12s, transform 0.1s;
}
.conf-btn:hover { border-color: var(--brand); background: var(--brand-soft); }
.conf-btn:active { transform: scale(0.98); }
.conf-hint { font-size: 12px; color: var(--ink-mute); margin-top: 8px; }

/* Vorhersage vor dem Quiz */
.pred-emoji { font-size: 48px; text-align: center; margin-bottom: 6px; }
.pred-grid { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-top: 6px; }
.pred-chip {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--card); border: 2px solid var(--line);
  font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 17px; color: var(--ink);
  cursor: pointer; box-shadow: var(--shadow);
  transition: border-color 0.12s, background 0.12s, transform 0.1s;
}
.pred-chip:hover { border-color: var(--brand); background: var(--brand-soft); transform: translateY(-2px); }

/* Wiederholungs-Hinweis */
.repeat-hint {
  background: var(--brand-soft); color: var(--brand-dark);
  border-left: 4px solid var(--brand); border-radius: 12px;
  padding: 11px 14px; font-size: 13.5px; font-weight: 600; margin-bottom: 18px;
}

/* Fall-Vignette */
.vignette {
  background: var(--bg); border: 1.5px solid var(--line);
  border-left: 4px solid var(--warn); border-radius: 14px;
  padding: 18px 20px; margin-bottom: 22px;
  font-size: 15px; line-height: 1.65; color: var(--ink-soft);
}
.vignette-title {
  font-family: 'Nunito', sans-serif; font-size: 12.5px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.08em; color: #b45309; margin-bottom: 10px;
}
.vignette-words { user-select: none; -webkit-user-select: none; }
.word { display: inline; cursor: pointer; border-radius: 3px; padding: 1px 1px; transition: background 0.1s; }
.word:hover { background: var(--ring-track); }
.word.marked { background: var(--highlight); font-weight: 600; color: var(--ink); }
.markings-info {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line);
  font-size: 13px; color: var(--ink-mute);
}
.markings-count strong { color: var(--brand-dark); }

/* Reasoning */
.reasoning-section { margin-bottom: 24px; }
.reasoning-help { font-size: 13px; color: var(--ink-mute); font-style: italic; margin-top: 4px; margin-bottom: 10px; }
.hypothesis-block {
  margin-bottom: 16px; padding: 16px;
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 14px;
}
.hypothesis-block label { margin-bottom: 4px; }

/* Ergebnis */
.result-hero { text-align: center; padding: 8px 0 0; }
.result-emoji { font-size: 56px; line-height: 1.1; }
.result-hero h1 { font-size: 26px; font-weight: 900; margin-top: 6px; }
.result-ring { width: 210px; height: 210px; margin: 18px auto; position: relative; }
.result-ring .val { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.result-ring .big-num { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 50px; line-height: 1; }
.result-ring .sub { font-size: 14px; color: var(--ink-mute); font-weight: 700; }
.result-badges { display: flex; gap: 9px; flex-wrap: wrap; justify-content: center; margin: 6px 0 18px; }
.result-badges .badge {
  background: var(--brand-soft); color: var(--brand-dark);
  padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 800;
  font-family: 'Nunito', sans-serif;
}
.result-badges .badge.badge-warn { background: var(--warn-soft); color: #b45309; }
.conf-flag { font-size: 12.5px; font-weight: 700; color: #b45309; margin-top: 6px; }

/* Status-Box */
.status { padding: 14px 18px; border-radius: 14px; margin-bottom: 16px; font-size: 14px; }
.status-info { background: var(--brand-soft); color: var(--brand-dark); }
.status-success { background: var(--good-soft); color: #15803d; }
.status-error { background: var(--wrong-soft); color: #b42318; }

.autosave-pill {
  position: fixed; bottom: 18px; right: 18px;
  background: var(--ink); color: #fff;
  padding: 9px 15px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
  box-shadow: var(--shadow-lift);
}
.autosave-pill.show { opacity: 0.92; }

/* Dialog-Modal */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(22,35,43,0.45);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; z-index: 200;
}
.modal {
  background: var(--card); border-radius: 18px;
  box-shadow: var(--shadow-lift); padding: 24px;
  max-width: 440px; width: 100%;
}
.modal-text { font-size: 15px; line-height: 1.55; color: var(--ink); white-space: pre-line; }
.modal .btn-row { justify-content: flex-end; }

/* Loading */
.loading {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff;
  border-radius: 50%; animation: spin 0.7s linear infinite;
  vertical-align: middle; margin-right: 6px;
}
.btn-ghost .loading, .empty-state .loading { border-color: var(--line); border-top-color: var(--brand); }
@keyframes spin { to { transform: rotate(360deg); } }

.hidden { display: none !important; }

let availableUnits = [];
// availableCourses: null = noch nicht geladen, [] = leer/fallback (Freitext + alles sichtbar),

let availableCourses = null;

// ============= HELPER: SHUFFLE & DISPLAY-PLAN =============
// Fisher-Yates, gibt eine neue Liste zurück
function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Quiz: 10 Fragen zufällig ziehen, Reihenfolge mischen, Antwortoptionen pro Frage mischen.
// Short_case: alle Fragen in Original-Reihenfolge, nur Antwortoptionen pro Frage mischen.
// Reasoning_case: kein Plan nötig.
// Der Plan speichert Original-Indizes — Antworten gehen mit Pool-Indizes an Supabase,
// damit Dashboard und Schwachstellenanalyse konsistent bleiben.
const QUIZ_QUESTIONS_PER_SESSION = 10;
const MAX_REPEAT_QUESTIONS = 5; // maximal so viele Wiederholungsfragen pro Session
let lastRepeatCount = 0;        // wird von buildDisplayPlan gesetzt, vom Aufrufer in session.repeatCount übernommen

function buildDisplayPlan(unit) {
  lastRepeatCount = 0;
  if (!unit || !unit.questions || !unit.questions.length) return null;
  if (unit.type === 'reasoning_case') return null;
  const allIndices = unit.questions.map((_, i) => i);
  let questionIndices;
  if (unit.type === 'quiz') {
    const n = Math.min(QUIZ_QUESTIONS_PER_SESSION, allIndices.length);
    // Spaced Repetition: zuletzt falsch beantwortete Fragen dieser Einheit bevorzugt ziehen
    const wrongPool = getWrongPool(unit.id).filter(i => i >= 0 && i < allIndices.length);
    const priority = shuffleArr(wrongPool).slice(0, Math.min(MAX_REPEAT_QUESTIONS, n));
    const rest = shuffleArr(allIndices.filter(i => !priority.includes(i))).slice(0, n - priority.length);
    questionIndices = shuffleArr(priority.concat(rest));
    lastRepeatCount = priority.length;
  } else {
    // short_case: alle Fragen, Reihenfolge unverändert
    questionIndices = allIndices;
  }
  return questionIndices.map(qIdx => {
    const q = unit.questions[qIdx];
    const optIndices = q && Array.isArray(q.options) ? q.options.map((_, i) => i) : [];
    return { originalQIdx: qIdx, optionOrder: shuffleArr(optIndices) };
  });
}

// ============= SEMESTER-VORGABE =============
async function loadCourses() {
  try {
    const res = await fetch(COURSES_INDEX + '?t=' + Date.now());
    if (!res.ok) { availableCourses = []; setupLoginFields(); return; }
    const data = await res.json();
    availableCourses = Array.isArray(data && data.klassen) ? data.klassen : [];
  } catch (err) {
    availableCourses = [];
  }
  setupLoginFields();
}

function hasCourses() {
  return !!(availableCourses && availableCourses.length);
}

function courseExists(name) {
  return (availableCourses || []).some(c => c.name === name);
}

// Mit Vorgabe: Name + Code, das Semester wird abgeleitet (keine Auswahl).
// Ohne lesbare kurse.json: Freitext-Semester wie früher, alles sichtbar.
function setupLoginFields() {
  document.getElementById('code-field').classList.toggle('hidden', !hasCourses());
  document.getElementById('class-field').classList.toggle('hidden', hasCourses());
}

// ============= SEMESTER-CODE =============
// Neue Schüler:innen geben beim ersten Mal den Code ihres Semesters ein, das Semester
// kommt aus dem Code (`code_sha256` in kurse.json). Danach erkennt die App das Semester
// am Namen (letzte Einsendung, sonst letzte Anmeldung auf diesem Gerät). Hürde, kein
// Schutz: Wer einen bekannten Namen eintippt, kommt ohne Code rein, und die Einheiten
// liegen im öffentlichen Repo.
const CODE_HASH_PREFIX = 'skilllab-semestercode:';

// Groß/klein, Leerzeichen, Bindestriche und Satzzeichen zählen nicht, ä = ae usw.
// Muss mit normCode()/hashCode() in dashboard.html übereinstimmen.
function normCode(code) {
  return String(code || '').normalize('NFC').toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/[^a-z0-9]/g, '');
}

async function hashCode(code) {
  const bytes = new TextEncoder().encode(CODE_HASH_PREFIX + normCode(code));
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function semesterForCode(code) {
  const hash = await hashCode(code);
  const cls = (availableCourses || []).find(c => c.code_sha256 === hash);
  return cls ? cls.name : null;
}

// { klasse } oder { klasse: null, offline } — nur Semester aus kurse.json zählen
async function semesterForName(name) {
  const r = await lookupClassForName(name);
  if (r.ok && r.klasse && courseExists(r.klasse)) return { klasse: r.klasse };
  const last = loadLastLogin();
  if (last && normName(last.name) === normName(name) && courseExists(last.class_name)) {
    return { klasse: last.class_name };
  }
  return { klasse: null, offline: !r.ok };
}

// Semester für den Login bestimmen. Gibt null zurück, nachdem ein Hinweis gezeigt wurde.
async function resolveSemester(name) {
  if (!hasCourses()) {
    const typed = document.getElementById('class_name').value.trim();
    if (typed) return typed;
    const r = await lookupClassForName(name);
    if (r.ok && r.klasse) return r.klasse;
    showDialog('Bitte trage dein Semester ein.');
    return null;
  }
  const codeInp = document.getElementById('semester_code');
  if (normCode(codeInp.value)) {
    let klasse;
    try {
      klasse = await semesterForCode(codeInp.value);
    } catch (e) {
      showDialog('Dein Browser kann den Code nicht prüfen. Bitte nutze einen aktuellen Browser.');
      return null;
    }
    if (!klasse) {
      showDialog('Dieser Code passt zu keinem Semester. Groß- und Kleinschreibung, Leerzeichen und Bindestriche spielen keine Rolle.');
      return null;
    }
    codeInp.value = '';
    return klasse;
  }
  const r = await semesterForName(name);
  if (r.klasse) return r.klasse;
  showDialog(r.offline
    ? 'Gerade keine Verbindung zum Server, deshalb finden wir deinen Namen nicht. Mit dem Code deines Semesters kommst du trotzdem rein.'
    : 'Diesen Namen finden wir nicht. Prüfe die Schreibweise, so wie bei deinen bisherigen Übungen. Bist du neu, gib zusätzlich den Code deines Semesters ein.');
  return null;
}

function getVisibleUnitIdsForClass(className) {
  // null = keine Filterung (alle nicht-versteckten Einheiten zeigen)
  // Array = nur diese unit-IDs zeigen
  if (!availableCourses || !availableCourses.length) return null;
  if (!className) return [];
  const cls = availableCourses.find(c => c.name === className);
  if (!cls) return null; // Klasse nicht in Vorgabe (z. B. Altdaten) → keine Filterung als Fallback
  return Array.isArray(cls.visible_units) ? cls.visible_units : [];
}

// ============= NAVIGATION =============

  ['login', 'topics', 'units', 'content', 'result'].forEach(s => {
    document.getElementById('screen-' + s).classList.add('hidden');
  });
  document.getElementById('screen-' + name).classList.remove('hidden');

  const btn = document.getElementById('submit-btn');
  if (btn) {
    btn.disabled = false;
    btn.textContent = 'Antworten absenden';
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

let loginBusy = false;

async function goToTopicSelection() {
  if (loginBusy) return;
  const name = document.getElementById('student_name').value.trim();
  if (!name) { showDialog('Bitte trage deinen Namen ein.'); return; }

  // Nachschlagen dauert kurz: Knopf sperren, damit niemand doppelt tippt
  const btn = document.getElementById('login-btn');
  loginBusy = true;
  btn.disabled = true;
  btn.textContent = 'Moment …';
  let klasse;
  try {
    klasse = await resolveSemester(name);
  } finally {
    loginBusy = false;
    btn.disabled = false;
    btn.textContent = 'Weiter';
  }
  if (!klasse) return;

  session.student_name = name;
  session.class_name = klasse;
  // Datum wird automatisch auf heute gesetzt (Feld entfernt)
  session.session_date = new Date().toISOString().split('T')[0];
  rememberLastLogin(name, klasse);

  showScreen('topics');
  loadIndex();
}

  session.answers = {};

async function loadIndex() {
  const topicList = document.getElementById('topic-list');
  if (topicList) topicList.innerHTML = '<div class="empty-state"><span class="loading"></span> Lade Themen…</div>';
  try {
    const res = await fetch(UNITS_INDEX + '?t=' + Date.now());
    if (!res.ok) throw new Error('Index nicht gefunden');
    availableUnits = await res.json();
    renderTopicsList();
  } catch (err) {
    if (topicList) {
      topicList.innerHTML = '<div class="status status-error">Themen konnten nicht geladen werden. Bitte deinen Dozenten ansprechen.</div>';
    }
  }
}

function renderTopicsList() {
  const list = document.getElementById('topic-list');
  if (!list) return;
  // Schüler sehen nur Einheiten, die (a) nicht versteckt sind und (b) für ihre Klasse freigeschaltet sind.
  const allowedIds = getVisibleUnitIdsForClass(session.class_name);
  const visibleUnits = availableUnits.filter(u =>
    !u.hidden && (allowedIds === null || allowedIds.includes(u.id))
  );
  if (!visibleUnits.length) {
    list.innerHTML = '<div class="empty-state">Für dein Semester sind aktuell keine Themen freigeschaltet. Bitte deinen Dozenten ansprechen.</div>';
    return;
  }
  // Eindeutige Themen aus den sichtbaren Einheiten ziehen, Reihenfolge der ersten Begegnung beibehalten.
  const seen = new Set();
  const topics = [];
  visibleUnits.forEach(u => {
    const tid = u.topic || 'sonstige';
    if (seen.has(tid)) return;
    seen.add(tid);
    topics.push({
      id: tid,
      title: u.topic_title || (tid === 'sonstige' ? 'Sonstige Einheiten' : tid),
      count: 0
    });
  });
  // Zählungen pro Thema (nur sichtbare Einheiten zählen)
  topics.forEach(t => {
    t.count = visibleUnits.filter(u => (u.topic || 'sonstige') === t.id).length;
  });
  list.innerHTML = '';
  topics.forEach(t => {
    const unitsOfTopic = visibleUnits.filter(u => (u.topic || 'sonstige') === t.id);
    const stats = topicMasteryStats(unitsOfTopic);
    const color = topicColor(t.id);
    const div = document.createElement('div');
    div.className = 'topic-card';
    div.style.setProperty('--tc', color);
    div.onclick = () => selectTopic(t.id, t.title);
    let progHtml;
    if (stats.pool > 0) {
      const pct = Math.round((stats.mastered / stats.pool) * 100);
      progHtml = `<div class="tbar"><i style="width:${pct}%"></i></div><span class="tpct">${stats.mastered} von ${stats.pool} Fragen gemeistert</span>`;
    } else {
      progHtml = `<div class="tbar"><i style="width:0%"></i></div><span class="tpct">Neu — jetzt starten</span>`;
    }
    div.innerHTML = `
      <div class="ticon">${topicIcon(t.id, 24)}</div>
      <h3>${escapeHtml(t.title)}</h3>
      <div class="tmeta">${t.count} Einheit${t.count === 1 ? '' : 'en'}</div>
      ${progHtml}
    `;
    list.appendChild(div);
  });

  // Gemischtes Quiz: Interleaving über alle freigeschalteten Themen (ab 2 Quiz-Einheiten)
  const quizUnits = visibleUnits.filter(u => u.type === 'quiz');
  if (quizUnits.length >= 2) {
    const div = document.createElement('div');
    div.className = 'mixed-banner';
    div.onclick = () => startMixedQuiz();
    div.innerHTML = `
      <div class="em">🎲</div>
      <div>
        <h3>Gemischtes Quiz</h3>
        <p>10 Fragen quer durch alle Themen — ideal zur Prüfungsvorbereitung</p>
      </div>
      <div class="go">→</div>
    `;
    list.appendChild(div);
  }

  renderPersonalCard(topics);
}

// ============= GEMISCHTES QUIZ (Interleaving) =============
async function startMixedQuiz() {
  const allowedIds = getVisibleUnitIdsForClass(session.class_name);
  const quizMetas = availableUnits.filter(u =>
    u.type === 'quiz' && !u.hidden && (allowedIds === null || allowedIds.includes(u.id))
  );
  if (quizMetas.length < 2) { showDialog('Für ein gemischtes Quiz braucht es mindestens zwei freigeschaltete Quiz-Einheiten.'); return; }
  try {
    const loaded = await Promise.all(quizMetas.map(async m => {
      const res = await fetch('einheiten/' + m.file + '?t=' + Date.now());
      if (!res.ok) throw new Error('Einheit ' + m.file + ' nicht gefunden');
      return { meta: m, unit: await res.json() };
    }));

    // Kandidaten sammeln; zuletzt falsch beantwortete Fragen (über alle Einheiten) bevorzugen
    const candidates = [];
    loaded.forEach(({ meta, unit }) => {
      const wrongPool = new Set(getWrongPool(unit.id));
      (unit.questions || []).forEach((q, qi) => {
        candidates.push({ q, unit_id: unit.id, unit_title: unit.title, origIdx: qi, wasWrong: wrongPool.has(qi) });
      });
    });
    if (candidates.length < 2) { showDialog('Zu wenige Fragen für ein gemischtes Quiz vorhanden.'); return; }

    const n = Math.min(QUIZ_QUESTIONS_PER_SESSION, candidates.length);
    const priority = shuffleArr(candidates.filter(c => c.wasWrong)).slice(0, Math.min(MAX_REPEAT_QUESTIONS, n));
    const rest = shuffleArr(candidates.filter(c => !priority.includes(c))).slice(0, n - priority.length);
    const chosen = shuffleArr(priority.concat(rest));

    session.unit = {
      id: 'gemischt',
      title: 'Gemischtes Quiz',
      type: 'quiz',
      mixed: true,
      intro: 'Fragen aus allen deinen Themen, bunt gemischt. Das Unterscheiden zwischen Krankheitsbildern trainiert genau das, was in der Prüfung zählt.',
      questions: chosen.map(c => c.q)
    };
    session.mixedMap = chosen.map(c => ({ unit_id: c.unit_id, unit_title: c.unit_title, origIdx: c.origIdx }));
    session.topic = 'gemischt';
    session.topic_title = 'Gemischtes Quiz';
    session.answers = {};
    session.markings = {};
    session.revealed = {};
    session.confidence = {};
    session.prediction = null;
    session.stepIdx = 0;
    session.repeatCount = priority.length;
    session.displayPlan = session.unit.questions.map((q, i) => ({
      originalQIdx: i,
      optionOrder: shuffleArr((q.options || []).map((_, j) => j))
    }));
    saveSession();
    showScreen('content');
    renderContent();
  } catch (err) {
    showDialog('Gemischtes Quiz konnte nicht geladen werden: ' + err.message);
  }
}

// Regelbasierte Empfehlungen nach Lernforschungs-Prinzipien:
// 1. Schwache Themen zuerst wiederholen (Retrieval Practice bei < 60 %)
// 2. Länger nicht geübte Themen auffrischen (Spacing ab 7 Tagen)
// 3. Neue Themen vorschlagen
function buildRecommendations(profile, topics) {
  const now = new Date();
  const recs = [];
  (topics || []).forEach(t => {
    const scored = profile.results.filter(r => r.topic === t.id && r.score_total > 0);
    if (!scored.length) {
      recs.push({ topicId: t.id, topicTitle: t.title, reason: 'Noch nicht geübt — probier es aus', prio: 3, sort: 0 });
      return;
    }
    const last = scored[scored.length - 1];
    const pct = Math.round((last.score_correct / last.score_total) * 100);
    const daysSince = Math.floor((now - new Date(last.ts)) / 86400000);
    if (pct < 60) {
      recs.push({ topicId: t.id, topicTitle: t.title, reason: `Zuletzt ${last.score_correct}/${last.score_total} richtig — gezieltes Wiederholen lohnt sich`, prio: 1, sort: pct });
    } else if (daysSince >= 7) {
      recs.push({ topicId: t.id, topicTitle: t.title, reason: `Seit ${daysSince} Tagen nicht geübt — Zeit zum Auffrischen`, prio: 2, sort: -daysSince });
    }
  });
  recs.sort((a, b) => a.prio - b.prio || a.sort - b.sort);
  return recs.slice(0, 3);
}

function renderUnitList() {
  const list = document.getElementById('unit-list');
  if (!list) return;
  // Nur sichtbare Einheiten des gewählten Themas, eingeschränkt auf die für die Klasse freigeschalteten.
  const allowedIds = getVisibleUnitIdsForClass(session.class_name);
  const filtered = availableUnits.filter(u =>
    (u.topic || 'sonstige') === session.topic
    && !u.hidden
    && (allowedIds === null || allowedIds.includes(u.id))
  );
  const sub = document.getElementById('units-sub');
  if (!filtered.length) {
    if (sub) sub.textContent = '';
    list.innerHTML = '<div class="empty-state">Für dieses Thema sind aktuell keine Einheiten freigeschaltet.</div>';
    return;
  }
  const tStats = topicMasteryStats(filtered);
  if (sub) {
    sub.textContent = `${filtered.length} Einheit${filtered.length === 1 ? '' : 'en'}`
      + (tStats.pool > 0 ? ` · ${tStats.mastered} von ${tStats.pool} Fragen gemeistert` : ' · neu');
  }
  const color = topicColor(session.topic);
  list.innerHTML = '';
  filtered.forEach(u => {
    const div = document.createElement('div');
    div.className = 'lesson-row';
    div.style.setProperty('--tc', color);
    div.onclick = () => selectUnit(u.file);
    const typeLabel = u.type === 'quiz' ? 'Quiz' : (u.type === 'short_case' ? 'Kurzfall' : 'Reasoning');
    let left, meta, tagCls = 'type-' + u.type, tagText = typeLabel;
    if (u.type === 'quiz') {
      const s = unitMasteryStats(u.id);
      if (s.attempts > 0) {
        const pct = s.poolSize > 0 ? Math.round((s.mastered / s.poolSize) * 100) : 0;
        left = smallRing(pct, color);
        const wdh = getWrongPool(u.id).length;
        meta = `${s.mastered} von ${s.poolSize} Fragen gemeistert${wdh ? ' · ' + wdh + ' zum Wiederholen' : ''}`;
      } else {
        left = smallRing(0, color);
        meta = u.description || 'Noch nicht gestartet';
      }
    } else {
      if (hasResultFor(u.id)) {
        left = '<div class="l-check"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>';
        meta = 'Bearbeitet — nochmal üben jederzeit möglich';
        tagCls = 'tag-done';
        tagText = '✓ ' + typeLabel;
      } else {
        left = '<div class="l-ring"><svg width="46" height="46"><circle cx="23" cy="23" r="19" fill="none" stroke="var(--ring-track)" stroke-width="5"/></svg><div class="val" style="color:var(--ink-mute)">–</div></div>';
        meta = u.description || 'Noch offen';
      }
    }
    div.innerHTML = `
      ${left}
      <div class="l-body"><h3>${escapeHtml(u.title)}</h3><p>${escapeHtml(meta)}</p></div>
      <span class="unit-tag ${tagCls}">${tagText}</span>

  });
}

async function selectUnit(file) {
  try {
    const res = await fetch('einheiten/' + file + '?t=' + Date.now());
    if (!res.ok) throw new Error('Einheit nicht gefunden');
    session.unit = await res.json();
    session.answers = {};
    session.markings = {};
    session.revealed = {};
    session.confidence = {};
    session.prediction = null;
    session.stepIdx = 0;
    session.mixedMap = null;
    session.displayPlan = buildDisplayPlan(session.unit);
    session.repeatCount = lastRepeatCount;

    showScreen('content');

    showDialog('Lerneinheit konnte nicht geladen werden: ' + err.message);

// ============= INHALT RENDERN =============
function renderContent() {
  const u = session.unit;
  const card = document.getElementById('content-card');
  const label = document.getElementById('progress-label');
  const counter = document.getElementById('progress-counter');

  label.textContent = u.title;
  counter.textContent = '';

  // Im Schritt-Modus (Quiz/Kurzfall) läuft das Absenden über den Button in der Karte —
  // der globale Absenden-Button gilt nur noch für Reasoning-Fälle.
  const submitBtn = document.getElementById('submit-btn');
  if (submitBtn) submitBtn.classList.toggle('hidden', u.type !== 'reasoning_case');

  if (u.type === 'quiz') {
    renderQuiz(card, u);
  } else if (u.type === 'short_case') {
    renderShortCase(card, u);
  } else if (u.type === 'reasoning_case') {
    renderReasoningCase(card, u);
  } else {
    card.innerHTML = '<p>Unbekannter Inhaltstyp.</p>';
  }
  updateProgress();
}

// Schritt-Modus: eine Frage pro Bildschirm, Antwort prüfen, sofortiges Feedback,
// dann weiter — nach der Lernforschung wirksamer als gesammeltes Feedback am Ende.
function renderQuiz(card, u) {
  renderStep(card, u);
}

function renderShortCase(card, u) {
  renderStep(card, u);
}

function renderStep(card, u) {
  if (!session.displayPlan || !session.displayPlan.length) {
    session.displayPlan = buildDisplayPlan(u);
    session.repeatCount = lastRepeatCount;
  }
  const plan = session.displayPlan;
  if (!plan || !plan.length) {
    card.innerHTML = '<p>Diese Einheit enthält keine Fragen.</p>';
    return;
  }
  if (!session.revealed) session.revealed = {};
  if (!session.confidence) session.confidence = {};
  // Alt-Sessions (vor dem Schritt-Modus): beantwortete Fragen als aufgedeckt übernehmen
  if (session.answers.questions) {
    Object.keys(session.answers.questions).forEach(k => {
      if (session.revealed[k] === undefined && session.answers.questions[k] != null) session.revealed[k] = true;
    });
  }

  // Vorhersage vor dem Quiz (Pretesting-Effekt + Metakognition) — nur Quiz, nur ganz am Anfang
  if (u.type === 'quiz' && session.prediction == null) {
    const answeredAny = session.answers.questions && Object.keys(session.answers.questions).length > 0;
    if (answeredAny) {
      session.prediction = -1; // mitten in alter Session — nicht mehr nachfragen
    } else {
      renderPrediction(card, u);
      return;
    }
  }
  if (typeof session.stepIdx !== 'number' || session.stepIdx < 0) {
    const first = plan.findIndex(p => !session.revealed[p.originalQIdx]);
    session.stepIdx = first === -1 ? plan.length - 1 : first;
  }
  if (session.stepIdx >= plan.length) session.stepIdx = plan.length - 1;

  const entry = plan[session.stepIdx];
  const q = u.questions[entry.originalQIdx];
  const isRevealed = !!session.revealed[entry.originalQIdx];
  const isLast = session.stepIdx === plan.length - 1;

  let html = `<h1>${escapeHtml(u.title)}</h1>`;
  if (session.stepIdx === 0) {
    if (u.intro) html += `<p class="lead">${escapeHtml(u.intro)}</p>`;
    if (session.repeatCount > 0) {
      html += `<div class="repeat-hint">🔁 Enthält ${session.repeatCount} Frage${session.repeatCount === 1 ? '' : 'n'}, die du zuletzt nicht sicher hattest — gezieltes Wiederholen wirkt.</div>`;
    }
  }
  if (u.type === 'short_case' && u.vignette) {
    html += renderVignette(u.vignette, false);
  }
  html += renderQuestion(q, entry.originalQIdx, 'q', entry.optionOrder, session.stepIdx);

  if (isRevealed) {
    const ans = session.answers.questions ? session.answers.questions[entry.originalQIdx] : null;
    const ok = isAnswerCorrect(q, ans);
    const conf = session.confidence[entry.originalQIdx];
    // Konfidenz-bewusstes Feedback: Hypercorrection-Effekt nutzen
    let head = ok ? '✓ Richtig' : '✗ Nicht ganz';
    if (ok && conf === 'geraten') head = '✓ Richtig — gut geraten! Lies die Erklärung trotzdem in Ruhe.';
    if (!ok && conf === 'sicher') head = '✗ Nicht ganz — und du warst dir sicher. Diese Erklärung lohnt sich doppelt.';
    html += `<div class="feedback ${ok ? 'correct' : 'wrong'}"><strong>${head}</strong>${escapeHtml(q.explanation || '')}</div>`;
    html += '<div class="btn-row step-nav">';
    if (session.stepIdx > 0) {
      html += '<button class="btn-ghost" onclick="prevStep()">← Vorherige Frage</button>';
    }
    if (!isLast) {
      html += '<button class="btn-primary" onclick="nextStep()">Weiter →</button>';
    } else {
      html += '<button class="btn-primary" onclick="submitContent()">Abschließen &amp; Ergebnis</button>';
    }
    html += '</div>';
  } else {
    // Sicherheits-Einschätzung: löst gleichzeitig die Prüfung aus (metakognitive Kalibrierung)
    html += `
      <div class="conf-box">
        <div class="conf-label">Wie sicher bist du dir?</div>
        <div class="conf-row">
          <button class="conf-btn" onclick="checkAnswer('sicher')">🎯 Sicher</button>
          <button class="conf-btn" onclick="checkAnswer('unsicher')">🤔 Unsicher</button>
          <button class="conf-btn" onclick="checkAnswer('geraten')">🎲 Geraten</button>
        </div>
        <div class="conf-hint">Antwort antippen, dann Sicherheit wählen — danach wird aufgelöst.</div>
      </div>`;
    if (session.stepIdx > 0) {
      html += '<div class="btn-row step-nav"><button class="btn-ghost" onclick="prevStep()">← Vorherige Frage</button></div>';
    }
  }

  card.innerHTML = html;
  attachOptionListeners();
  if (isRevealed) decorateRevealed(q, entry.originalQIdx);
}

// Vorhersage-Screen vor dem Quiz
function renderPrediction(card, u) {
  const n = session.displayPlan.length;
  let chips = '';
  for (let i = 0; i <= n; i++) {
    chips += `<button class="pred-chip" onclick="setPrediction(${i})">${i}</button>`;
  }
  card.innerHTML = `
    <div class="pred-emoji">🔮</div>
    <h1 style="text-align:center;">Kurz geschätzt!</h1>
    <p class="lead" style="text-align:center;">Wie viele der <strong>${n} Fragen</strong> wirst du richtig beantworten?<br>Die Einschätzung schärft den Blick für den eigenen Wissensstand.</p>
    <div class="pred-grid">${chips}</div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn-ghost" onclick="setPrediction(-1)">Lieber überspringen</button>
    </div>
  `;
}

function setPrediction(n) {
  session.prediction = n;
  saveSession();
  renderContent();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Nach dem Prüfen: richtige Option grün, falsch gewählte rot, Eingaben sperren
function decorateRevealed(q, origIdx) {
  const ans = session.answers.questions ? session.answers.questions[origIdx] : null;
  document.querySelectorAll(`.option[data-q="${origIdx}"]`).forEach(el => {
    const oi = parseInt(el.dataset.o);
    const isCorrectOpt = q.multi ? q.correct.includes(oi) : q.correct === oi;
    const wasSelected = q.multi ? (Array.isArray(ans) && ans.includes(oi)) : ans === oi;
    if (isCorrectOpt) el.classList.add('correct');
    else if (wasSelected) el.classList.add('wrong');
    const input = el.querySelector('input');
    if (input) input.disabled = true;
    el.classList.add('locked');
  });
}

function checkAnswer(conf) {
  const plan = session.displayPlan;
  if (!plan) return;
  const entry = plan[session.stepIdx];
  const ans = session.answers.questions ? session.answers.questions[entry.originalQIdx] : null;
  const hasAnswer = Array.isArray(ans) ? ans.length > 0 : ans != null;
  if (!hasAnswer) {
    showDialog('Bitte wähle zuerst eine Antwort aus — dann deine Sicherheit.');
    return;
  }
  if (!session.confidence) session.confidence = {};
  if (conf) session.confidence[entry.originalQIdx] = conf;
  session.revealed[entry.originalQIdx] = true;
  saveSession();
  renderContent();
}

function nextStep() {
  if (session.stepIdx < session.displayPlan.length - 1) {
    session.stepIdx++;
    saveSession();
    renderContent();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function prevStep() {
  if (session.stepIdx > 0) {
    session.stepIdx--;
    saveSession();
    renderContent();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

  }
}

function setVal(id, v) { if (v != null) document.getElementById(id).value = v; }

function renderVignette(text, withMarking) {
  let inner;
  if (withMarking) {
    // Zerlege in Wörter
    const tokens = text.split(/(\s+|[.,;:!?„""()\-–])/);
    inner = '<div class="vignette-words">';
    let wordIdx = 0;
    tokens.forEach(t => {
      if (/^\s+$/.test(t)) {
        inner += t;
      } else if (/^[.,;:!?„""()\-–]$/.test(t)) {
        inner += escapeHtml(t);
      } else if (t.length === 0) {
        // skip
      } else {
        inner += `<span class="word" data-idx="${wordIdx}" onclick="toggleMark(this)">${escapeHtml(t)}</span>`;
        wordIdx++;
      }
    });
    inner += '</div>';
    inner += `
      <div class="markings-info">
        <div class="markings-count">Markiert: <strong id="marking-count">0</strong></div>
        <button class="btn-ghost" onclick="clearMarkings()">Alle Markierungen löschen</button>
      </div>
    `;
  } else {
    inner = `<div>${escapeHtml(text).replace(/\n/g, '<br>')}</div>`;
  }
  return `
    <div class="vignette">
      <div class="vignette-title">Patientenvignette</div>
      ${inner}
    </div>
  `;
}

function toggleMark(el) {
  el.classList.toggle('marked');
  const idx = el.dataset.idx;
  if (el.classList.contains('marked')) {
    session.markings[idx] = el.textContent;
  } else {
    delete session.markings[idx];
  }
  updateMarkingsCount();
  saveSession();
}

function clearMarkings() {
  document.querySelectorAll('.word.marked').forEach(el => el.classList.remove('marked'));
  session.markings = {};
  updateMarkingsCount();
  saveSession();
}

function updateMarkingsCount() {
  const el = document.getElementById('marking-count');
  if (el) el.textContent = Object.keys(session.markings).length;
}

function attachWordListeners() {
  // schon im HTML via onclick
}

function renderQuestion(q, originalQIdx, prefix, optionOrder, displayIdx) {
  const isMulti = q.multi === true;
  const inputType = isMulti ? 'checkbox' : 'radio';
  const numberShown = (typeof displayIdx === 'number') ? displayIdx + 1 : originalQIdx + 1;
  const order = Array.isArray(optionOrder) && optionOrder.length === q.options.length
    ? optionOrder
    : q.options.map((_, i) => i);
  let html = `
    <div class="question" data-q="${originalQIdx}">
      <div class="question-num">Frage ${numberShown}${isMulti ? ' · Mehrfachauswahl' : ''}</div>
      <div class="question-text">${escapeHtml(q.text)}</div>
      <div class="options">
  `;
  order.forEach(oi => {
    const opt = q.options[oi];
    html += `
      <label class="option" data-q="${originalQIdx}" data-o="${oi}">
        <input type="${inputType}" name="${prefix}_${originalQIdx}" value="${oi}" onchange="onOptionChange(${originalQIdx})">
        <span class="option-text">${escapeHtml(opt)}</span>
      </label>
    `;
  });
  html += `</div></div>`;
  return html;
}

function attachOptionListeners() {
  // Wiederhergestellte Antworten setzen
  if (session.answers.questions) {
    Object.entries(session.answers.questions).forEach(([qIdx, val]) => {
      const arr = Array.isArray(val) ? val : [val];
      arr.forEach(v => {
        const input = document.querySelector(`input[name="q_${qIdx}"][value="${v}"]`);
        if (input) {
          input.checked = true;
          input.closest('.option').classList.add('selected');
        }
      });
    });
  }
}

function onOptionChange(qIdx) {
  const u = session.unit;
  const q = u.questions ? u.questions[qIdx] : null;
  if (!q) return;
  const inputs = document.querySelectorAll(`input[name="q_${qIdx}"]`);
  const selected = [];
  inputs.forEach(i => {
    const opt = i.closest('.option');
    if (i.checked) {
      selected.push(parseInt(i.value));
      opt.classList.add('selected');
    } else {
      opt.classList.remove('selected');
    }
  });
  if (!session.answers.questions) session.answers.questions = {};
  session.answers.questions[qIdx] = q.multi ? selected : (selected[0] ?? null);
  saveSession();
  updateProgress();
}

function saveReasoning() {
  session.answers.reasoning = {
    triage: document.getElementById('r_triage').value,
    triage_reason: document.getElementById('r_triage_reason').value,
    main_hypothesis: document.getElementById('r_main').value,
    main_reason: document.getElementById('r_main_reason').value,
    alternative_hypotheses: document.getElementById('r_alt').value,
    redflag_hypothesis: document.getElementById('r_redflag').value,
    redflag_reason: document.getElementById('r_redflag_reason').value,
    further_plan: document.getElementById('r_plan').value
  };
  saveSession();
  updateProgress();
}

function updateProgress() {
  const u = session.unit;
  const fill = document.getElementById('progress-fill');
  const counter = document.getElementById('progress-counter');
  if (!u) return;
  let progress = 0;
  if (u.type === 'quiz' || u.type === 'short_case') {
    const plan = session.displayPlan || [];
    const total = plan.length || (u.questions ? u.questions.length : 0);
    const done = session.revealed
      ? plan.filter(p => session.revealed[p.originalQIdx]).length
      : (session.answers.questions ? Object.keys(session.answers.questions).length : 0);
    progress = total ? (done / total) * 100 : 0;
    counter.textContent = `Frage ${Math.min((session.stepIdx || 0) + 1, total)} / ${total}`;
  } else if (u.type === 'reasoning_case') {
    const r = session.answers.reasoning || {};
    const fields = ['triage', 'main_hypothesis', 'further_plan'];
    const filled = fields.filter(f => r[f] && r[f].trim().length > 0).length;
    progress = (filled / fields.length) * 100;
    counter.textContent = `${filled} / ${fields.length} Pflichtfelder`;
  }
  fill.style.width = progress + '%';
}

// ============= ABSENDEN =============
// Wird mit silentReturn=true vom "Zurück"-Button aufgerufen — dann werden Antworten gespeichert
// und zur Themen-Maske bzw. Unit-Liste zurück navigiert, ohne den Ergebnis-Screen anzuzeigen.
async function submitContent(silentReturn) {
  const u = session.unit;
  if (!u) return;

  // Zurück ohne eine einzige Eingabe: nichts senden, nur navigieren
  if (silentReturn) {
    const hasAny = (session.answers.questions && Object.keys(session.answers.questions).length > 0)
      || session.answers.reasoning
      || Object.keys(session.markings || {}).length > 0;
    if (!hasAny) {
      clearSavedSession();
      returnToList();
      return;
    }
  }

  // Welche Fragen wurden in dieser Session überhaupt gestellt?
  const askedIndices = session.displayPlan
    ? session.displayPlan.map(p => p.originalQIdx)
    : (u.questions ? u.questions.map((_, i) => i) : []);

  // Validierung — beim Zurück-Modus überspringen, weil unvollständige Antworten erlaubt sind
  if (!silentReturn && (u.type === 'quiz' || u.type === 'short_case')) {
    const total = askedIndices.length;
    const answered = session.answers.questions ? Object.keys(session.answers.questions).length : 0;
    if (answered < total) {
      const ok = await showDialog(`Du hast erst ${answered} von ${total} Fragen beantwortet. Trotzdem absenden?`, { okText: 'Trotzdem absenden', cancelText: 'Weiter bearbeiten' });
      if (!ok) return;
    }
  }

  // Auswertung berechnen — nur die in dieser Session gestellten Fragen
  let scoreCorrect = null, scoreTotal = null;
  const wrongIdx = [];
  if ((u.type === 'quiz' || u.type === 'short_case') && u.questions) {
    scoreTotal = askedIndices.length;
    scoreCorrect = 0;
    askedIndices.forEach(idx => {
      const q = u.questions[idx];
      const ans = session.answers.questions ? session.answers.questions[idx] : null;
      if (isAnswerCorrect(q, ans)) scoreCorrect++;
      else wrongIdx.push(idx);
    });
  }

  // Daten an Supabase senden
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span> Sende…';
  const stepBtn = document.querySelector('#content-card .step-nav .btn-primary');
  if (stepBtn) {
    stepBtn.disabled = true;
    stepBtn.innerHTML = '<span class="loading"></span> Sende…';
  }

  // Gemischtes Quiz: pro Quell-Einheit eine Zeile senden, mit Original-Indizes —
  // so bleiben Schwachstellen-Analyse und Dashboard vollständig konsistent.
  let payload;
  const mixedGroups = {};
  if (u.mixed && session.mixedMap) {
    askedIndices.forEach(idx => {
      const src = session.mixedMap[idx];
      if (!src) return;
      const q = u.questions[idx];
      const ans = session.answers.questions ? session.answers.questions[idx] : null;
      if (!mixedGroups[src.unit_id]) {
        mixedGroups[src.unit_id] = { unit_id: src.unit_id, unit_title: src.unit_title, questions: {}, conf: {}, correct: 0, total: 0, asked: [], wrong: [] };
      }
      const g = mixedGroups[src.unit_id];
      if (ans != null) g.questions[src.origIdx] = ans;
      if (session.confidence && session.confidence[idx]) g.conf[src.origIdx] = session.confidence[idx];
      g.total++;
      g.asked.push(src.origIdx);
      if (isAnswerCorrect(q, ans)) g.correct++;
      else g.wrong.push(src.origIdx);
    });
    payload = Object.values(mixedGroups).map(g => ({
      student_name: session.student_name,
      class_name: session.class_name,
      session_date: session.session_date,
      unit_id: g.unit_id,
      unit_title: g.unit_title,
      content_type: 'quiz',
      answers: Object.assign(
        { questions: g.questions, markings: [], mixed_session: true },
        Object.keys(g.conf).length ? { confidence: g.conf } : {}
      ),
      score_correct: g.correct,
      score_total: g.total
    }));
  } else {
    payload = {
      student_name: session.student_name,
      class_name: session.class_name,
      session_date: session.session_date,
      unit_id: session.unit.id,
      unit_title: session.unit.title,
      content_type: session.unit.type,
      answers: {
        ...session.answers,
        markings: Object.values(session.markings),
        ...(session.confidence && Object.keys(session.confidence).length ? { confidence: session.confidence } : {}),
        ...(session.prediction != null && session.prediction >= 0 ? { prediction: session.prediction } : {})
      },
      score_correct: scoreCorrect,
      score_total: scoreTotal
    };
  }

  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/submissions', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(errText || 'Speichern fehlgeschlagen');
    }
    clearSavedSession();
    // Ergebnis lokal im Geräte-Verlauf festhalten (für persönliche Startseite
    // und den Wiederholungs-Pool: falsch beantwortete Fragen kommen bevorzugt wieder)
    const entry = {
      ts: new Date().toISOString(),
      day: localDay(),
      unit_id: session.unit.id,
      unit_title: session.unit.title,
      topic: session.topic,
      topic_title: session.topic_title,
      type: session.unit.type,
      score_correct: scoreCorrect,
      score_total: scoreTotal
    };
    if (!u.mixed && u.questions && (u.type === 'quiz' || u.type === 'short_case')) {
      entry.pool_size = u.questions.length;
    }
    if (session.prediction != null && session.prediction >= 0) {
      entry.prediction = session.prediction;
    }
    if (u.mixed && session.mixedMap) {
      entry.asked_by_unit = {};
      entry.wrong_by_unit = {};
      Object.values(mixedGroups).forEach(g => {
        entry.asked_by_unit[g.unit_id] = g.asked;
        entry.wrong_by_unit[g.unit_id] = g.wrong;
      });
    } else if (u.type === 'quiz' || u.type === 'short_case') {
      entry.asked_q = askedIndices;
      entry.wrong_q = wrongIdx;
    }
    const meta = recordResult(entry);
    if (silentReturn) {
      // Antworten gespeichert — zurück zur Liste, kein Ergebnis-Screen
      showAutosavePill('✓ Antworten gespeichert');
      returnToList();
    } else {
      try {
        showResult(scoreCorrect, scoreTotal, meta);
      } catch (e) {
        console.error('Fehler bei Ergebnisanzeige:', e);
        showDialog('Deine Antworten wurden gespeichert! Es gab nur ein kleines Problem bei der Anzeige der Ergebnisseite. Du kannst die Seite neu laden.');
        btn.disabled = false;
        btn.textContent = 'Antworten absenden';
      }
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Antworten absenden';
    if (stepBtn) {
      stepBtn.disabled = false;
      stepBtn.innerHTML = 'Abschließen &amp; Ergebnis';
    }
    showDialog('Fehler beim Speichern: ' + err.message + '\n\nDeine Antworten sind lokal noch erhalten. Versuche es bitte gleich noch einmal.');
  }
}

// Einheit verlassen: beim gemischten Quiz zur Themen-Übersicht, sonst zur Unit-Liste
function returnToList() {
  const wasMixed = !!session.mixedMap;
  session.unit = null;
  session.answers = {};
  session.markings = {};
  session.displayPlan = null;
  session.revealed = {};
  session.confidence = {};
  session.prediction = null;
  session.stepIdx = 0;
  session.repeatCount = 0;
  session.mixedMap = null;
  if (wasMixed) {
    session.topic = '';
    session.topic_title = '';
    showScreen('topics');
    renderTopicsList();
  } else {
    showScreen('units');
    renderUnitList();
  }
}

function isAnswerCorrect(q, ans) {
  if (ans == null) return false;
  if (q.multi) {
    if (!Array.isArray(ans) || !Array.isArray(q.correct)) return false;
    if (ans.length !== q.correct.length) return false;
    const sorted1 = [...ans].sort();
    const sorted2 = [...q.correct].sort();
    return sorted1.every((v, i) => v === sorted2[i]);
  }
  return ans === q.correct;
}

function showResult(correctCount, total, meta) {
  const u = session.unit;
  const card = document.getElementById('result-card');
  let html = '';

  if (correctCount !== null && total !== null && total > 0) {
    const pct = Math.round((correctCount / total) * 100);
    const mood = pct >= 80 ? ['🎉', 'Stark gemacht!'] : (pct >= 50 ? ['💪', 'Gut dabei!'] : ['🌱', 'Dranbleiben — Wiederholen wirkt!']);
    const ringColor = pct >= 70 ? 'var(--good)' : 'var(--brand)';
    const dash = 565; // 2π·90
    const off = Math.round(dash * (1 - pct / 100));
    html += `
      <div class="result-hero">
        <div class="result-emoji">${mood[0]}</div>
        <h1>${mood[1]}</h1>
      </div>
      <div class="result-ring">
        <svg width="210" height="210"><circle cx="105" cy="105" r="90" fill="none" stroke="var(--ring-track)" stroke-width="15"/><circle cx="105" cy="105" r="90" fill="none" stroke="${ringColor}" stroke-width="15" stroke-linecap="round" stroke-dasharray="${dash}" stroke-dashoffset="${off}" transform="rotate(-90 105 105)"/></svg>
        <div class="val"><span class="big-num" style="color:${ringColor}">${correctCount}/${total}</span><span class="sub">${pct}% richtig</span></div>
      </div>
    `;

    // Persönliche Highlights: Lerntage im Monat, Bestleistung, Vorhersage-Vergleich
    const badges = [];
    if (meta && meta.monthDays >= 2) badges.push(`📅 ${meta.monthDays}. Lerntag im ${meta.monthName}`);
    if (meta && meta.isPersonalBest) badges.push('⭐ Persönlicher Rekord');
    if (session.prediction != null && session.prediction >= 0) {
      const diff = correctCount - session.prediction;
      const verdict = diff > 0 ? 'besser als gedacht!' : (diff === 0 ? 'punktgenau geschätzt!' : 'etwas zu optimistisch');
      badges.push(`🔮 Geschätzt ${session.prediction}, geschafft ${correctCount} — ${verdict}`);
    }
    if (badges.length) {
      html += `<div class="result-badges">${badges.map(b => `<span class="badge">${b}</span>`).join('')}</div>`;
    }

    // Themen-Fortschritt der Einheit (nur normale Einheiten mit bekanntem Pool)
    if (!u.mixed) {
      const s = unitMasteryStats(u.id);
      if (s.poolSize > 0) {
        const upct = Math.round((s.mastered / s.poolSize) * 100);
        const gdash = 201;
        const goff = Math.round(gdash * (1 - Math.min(upct, 100) / 100));
        const color = topicColor(session.topic);
        html += `
          <div class="card">
            <div class="goal-row">
              <div class="ringwrap">
                <svg width="74" height="74"><circle cx="37" cy="37" r="32" fill="none" stroke="var(--ring-track)" stroke-width="8"/><circle cx="37" cy="37" r="32" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${gdash}" stroke-dashoffset="${goff}" transform="rotate(-90 37 37)"/></svg>
                <div class="val" style="color:${color}">${upct}%</div>
              </div>
              <div class="goal-txt">
                <h3>${escapeHtml(u.title)}</h3>
                <p><strong>${s.mastered} von ${s.poolSize} Fragen</strong> gemeistert — gemeistert heißt: zweimal in Folge richtig.</p>
              </div>
            </div>
          </div>
        `;
      }
    }

    // Detailauswertung — nur die in dieser Session gestellten Fragen,
    // in der gleichen Reihenfolge wie im Quiz
    html += '<h2 style="margin-top:24px;">Auswertung</h2>';
    const askedForResult = session.displayPlan
      ? session.displayPlan.map(p => p.originalQIdx)
      : u.questions.map((_, i) => i);
    askedForResult.forEach((origIdx, displayIdx) => {
      const q = u.questions[origIdx];
      const ans = session.answers.questions ? session.answers.questions[origIdx] : null;
      const isCorrect = isAnswerCorrect(q, ans);
      html += `
        <div class="question">
          <div class="question-num">Frage ${displayIdx + 1} · ${isCorrect ? 'Richtig' : 'Falsch'}</div>
          <div class="question-text">${escapeHtml(q.text)}</div>
          <div class="options">
      `;
      q.options.forEach((opt, oi) => {
        const isCorrectOption = q.multi ? q.correct.includes(oi) : q.correct === oi;
        const wasSelected = q.multi ? (Array.isArray(ans) && ans.includes(oi)) : ans === oi;
        let cls = 'option';
        if (isCorrectOption) cls += ' correct';
        else if (wasSelected) cls += ' wrong';
        html += `<div class="${cls}"><span class="option-text">${escapeHtml(opt)}</span></div>`;
      });
      html += '</div>';
      if (q.explanation) {
        html += `<div class="feedback ${isCorrect ? 'correct' : 'wrong'}"><strong>${isCorrect ? '✓ Richtig' : '✗ Erläuterung'}</strong>${escapeHtml(q.explanation)}</div>`;
      }
      // Hinweis auf selbstsichere Fehler (Hypercorrection: genau hier hinschauen)
      const conf = session.confidence ? session.confidence[origIdx] : null;
      if (!isCorrect && conf === 'sicher') {
        html += '<div class="conf-flag">🎯 Du warst dir hier sicher — genau diese Frage lohnt einen zweiten Blick.</div>';
      }
      html += '</div>';
    });
  } else if (u.type === 'reasoning_case') {
    html += `
      <div class="result-hero" style="margin-bottom:18px;">
        <div class="result-emoji">📋</div>
        <h1>Eingereicht!</h1>
      </div>
      <div class="status status-success">
        Deine Falllösung wurde erfasst und wird im Unterricht besprochen. Eine automatische Auswertung gibt es bei Reasoning-Fällen nicht — dein Dozent prüft deine Antworten manuell.
      </div>
    `;
    if (u.expert_solution) {
      html += `<h2 style="margin-top:24px;">Wie es weiterging</h2>
      <div class="vignette" style="border-left-color: var(--good);">
        <div class="vignette-title" style="color:var(--good);">Experten-Lösung</div>
        <div>${escapeHtml(u.expert_solution).replace(/\n/g, '<br>')}</div>
      </div>`;
    }
  }

  html += `
    <div class="btn-row">
      <button class="btn-primary" onclick="restartFlow()">Weitere Einheit bearbeiten</button>
      <button class="btn-ghost" onclick="backToTopics()">Zur Themen-Übersicht</button>
    </div>
  `;
  card.innerHTML = html;
  showScreen('result');
}
