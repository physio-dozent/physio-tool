// ============= ZWISCHENSPEICHERN =============
let saveTimer = null;
function saveSession() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem('physio_session_v3', JSON.stringify(session));
      showAutosavePill();
    } catch (e) { /* speicher voll oder geblockt */ }
  }, 400);
}

function loadSavedSession() {
  try {
    const raw = localStorage.getItem('physio_session_v3');
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

function clearSavedSession() {
  // Laufenden Autosave-Timer stoppen, sonst schreibt er den Zustand gleich wieder rein
  clearTimeout(saveTimer);
  try { localStorage.removeItem('physio_session_v3'); } catch (e) {}
}

function showAutosavePill(text) {
  const pill = document.getElementById('autosave-pill');
  const customText = !!text;
  if (customText) pill.textContent = text;
  pill.classList.add('show');
  clearTimeout(pill._timer);
  pill._timer = setTimeout(() => {
    pill.classList.remove('show');
    if (customText) pill.textContent = '✓ Zwischengespeichert';
  }, customText ? 2200 : 1500);
}

// ============= GERÄTE-VERLAUF (Profile pro Name, localStorage) =============
const PROFILES_KEY = 'physio_profiles_v1';
const LAST_LOGIN_KEY = 'physio_last_login_v1';

function normName(name) {
  return (name || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

function loadProfiles() {
  try { return JSON.parse(localStorage.getItem(PROFILES_KEY)) || {}; } catch (e) { return {}; }
}

function saveProfiles(p) {
  try { localStorage.setItem(PROFILES_KEY, JSON.stringify(p)); } catch (e) { /* Speicher voll oder geblockt */ }
}

function getProfile(name) {
  const key = normName(name);
  if (!key) return null;
  return loadProfiles()[key] || null;
}

// Speichert ein Ergebnis im lokalen Verlauf und liefert Metadaten
// für die Ergebnisseite (Lerntage im Monat, persönliche Bestleistung).
function recordResult(entry) {
  const out = { monthDays: 0, monthName: '', isPersonalBest: false };
  const key = normName(session.student_name);
  if (!key) return out;
  const profiles = loadProfiles();
  if (!profiles[key]) profiles[key] = { name: session.student_name, class_name: session.class_name, results: [] };
  const prof = profiles[key];
  prof.class_name = session.class_name;

  const prev = prof.results.filter(r => r.unit_id === entry.unit_id && r.score_total > 0);
  if (entry.score_total > 0 && prev.length) {
    const pct = entry.score_correct / entry.score_total;
    out.isPersonalBest = prev.every(r => pct > r.score_correct / r.score_total);
  }

  prof.results.push(entry);
  if (prof.results.length > 300) prof.results = prof.results.slice(-300);
  saveProfiles(profiles);
  const month = computeMonthDays(prof);
  out.monthDays = month.days;
  out.monthName = month.monthName;
  return out;
}

// Lokales Datum als YYYY-MM-DD (bewusst nicht UTC, damit spätabends kein Tag verrutscht)
function localDay(d) {
  const x = d || new Date();
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
}

function fmtDay(day) {
  if (day === localDay()) return 'Heute';
  const y = new Date();
  y.setDate(y.getDate() - 1);
  if (day === localDay(y)) return 'Gestern';
  const p = (day || '').split('-');
  return p.length === 3 ? p[2] + '.' + p[1] + '.' : day;
}

// Lerntage im laufenden Monat = verschiedene Tage mit mindestens einem Ergebnis.
// Bewusst keine Serie: ein ausgelassener Tag setzt nichts auf null.
function computeMonthDays(profile) {
  const monthName = new Date().toLocaleDateString('de-DE', { month: 'long' });
  if (!profile || !profile.results || !profile.results.length) return { days: 0, monthName };
  const prefix = localDay().slice(0, 8); // "YYYY-MM-"
  const daySet = new Set(profile.results.map(r => r.day).filter(d => typeof d === 'string' && d.startsWith(prefix)));
  return { days: daySet.size, monthName };
}

// Wiederholungs-Pool: welche Fragen einer Einheit wurden zuletzt falsch beantwortet?
// Chronologisch ausgewertet — wer eine Frage später richtig hat, fällt aus dem Pool
// (Prinzip des „successive relearning").
function getWrongPool(unitId) {
  const prof = getProfile(session.student_name);
  if (!prof || !prof.results) return [];
  const pool = new Set();
  prof.results.forEach(r => {
    let asked = null, wrong = null;
    if (r.unit_id === unitId && Array.isArray(r.asked_q)) {
      asked = r.asked_q;
      wrong = r.wrong_q;
    } else if (r.asked_by_unit && Array.isArray(r.asked_by_unit[unitId])) {
      asked = r.asked_by_unit[unitId];
      wrong = r.wrong_by_unit ? r.wrong_by_unit[unitId] : null;
    }
    if (!asked) return;
    asked.forEach(i => pool.delete(i));
    (wrong || []).forEach(i => pool.add(i));
  });
  return [...pool];
}

// ============= MASTERY (gemeistert = 2× in Folge richtig) =============
const MASTERY_STREAK = 2;
const DAILY_GOAL_QUESTIONS = 10;

// Pro Frage einer Einheit: aktuelle Serie richtiger Antworten (chronologisch)
function getQuestionStreaks(unitId) {
  const streaks = {};
  const prof = getProfile(session.student_name);
  if (!prof || !prof.results) return streaks;
  prof.results.forEach(r => {
    let asked = null, wrong = null;
    if (r.unit_id === unitId && Array.isArray(r.asked_q)) {
      asked = r.asked_q;
      wrong = r.wrong_q || [];
    } else if (r.asked_by_unit && Array.isArray(r.asked_by_unit[unitId])) {
      asked = r.asked_by_unit[unitId];
      wrong = (r.wrong_by_unit || {})[unitId] || [];
    }
    if (!asked) return;
    asked.forEach(i => { streaks[i] = wrong.includes(i) ? 0 : (streaks[i] || 0) + 1; });
  });
  return streaks;
}

function unitMasteryStats(unitId) {
  const prof = getProfile(session.student_name);
  let poolSize = 0, attempts = 0;
  if (prof && prof.results) {
    prof.results.forEach(r => {
      if (r.unit_id === unitId) {
        attempts++;
        if (r.pool_size) poolSize = Math.max(poolSize, r.pool_size);
      } else if (r.asked_by_unit && r.asked_by_unit[unitId]) {
        attempts++;
      }
    });
  }
  const streaks = getQuestionStreaks(unitId);
  const seen = Object.keys(streaks).length;
  const mastered = Object.values(streaks).filter(s => s >= MASTERY_STREAK).length;
  return { mastered, poolSize: Math.max(poolSize, seen), seen, attempts };
}

function topicMasteryStats(unitsOfTopic) {
  let mastered = 0, pool = 0, played = 0;
  unitsOfTopic.forEach(u => {
    if (u.type === 'reasoning_case') return;
    const s = unitMasteryStats(u.id);
    if (s.attempts > 0) {
      played++;
      mastered += s.mastered;
      pool += s.poolSize;
    }
  });
  return { mastered, pool, played };
}

function totalMasteredQuestions(profile) {
  if (!profile) return 0;
  const unitIds = new Set();
  profile.results.forEach(r => {
    if (r.asked_q) unitIds.add(r.unit_id);
    if (r.asked_by_unit) Object.keys(r.asked_by_unit).forEach(id => unitIds.add(id));
  });
  let total = 0;
  unitIds.forEach(id => { total += unitMasteryStats(id).mastered; });
  return total;
}

function avgScorePct(profile) {
  if (!profile) return null;
  const scored = profile.results.filter(r => r.score_total > 0);
  if (!scored.length) return null;
  return Math.round(scored.reduce((s, r) => s + r.score_correct / r.score_total, 0) / scored.length * 100);
}

// Tagesziel: heute beantwortete Fragen
function questionsAnsweredToday(profile) {
  if (!profile) return 0;
  const today = localDay();
  return profile.results
    .filter(r => r.day === today && r.score_total > 0)
    .reduce((s, r) => s + r.score_total, 0);
}

function hasResultFor(unitId) {
  const prof = getProfile(session.student_name);
  return !!(prof && prof.results.some(r => r.unit_id === unitId));
}

// Kleiner SVG-Fortschrittsring (46px) für Einheiten-Listen
function smallRing(pct, color) {
  const dash = 119; // 2π·19
  const off = Math.round(dash * (1 - Math.min(pct, 100) / 100));
  const stroke = pct > 0 ? `<circle cx="23" cy="23" r="19" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${dash}" stroke-dashoffset="${off}" transform="rotate(-90 23 23)"/>` : '';
  return `<div class="l-ring"><svg width="46" height="46"><circle cx="23" cy="23" r="19" fill="none" stroke="var(--ring-track)" stroke-width="5"/>${stroke}</svg><div class="val" style="color:${pct > 0 ? color : 'var(--ink-mute)'}">${pct}%</div></div>`;
}

function updateAvatar() {
  const av = document.getElementById('user-avatar');
  if (!av) return;
  const initial = (session.student_name || '').trim().charAt(0).toUpperCase();
  if (initial) {
    av.textContent = initial;
    av.classList.remove('hidden');
  } else {
    av.classList.add('hidden');
  }
}

function rememberLastLogin(name, klasse) {
  try { localStorage.setItem(LAST_LOGIN_KEY, JSON.stringify({ name, class_name: klasse })); } catch (e) {}
}

// ============= NAME NACHSCHLAGEN (Supabase-RPC klasse_fuer_name) =============
// Liefert das Semester der jüngsten Einsendung zu diesem Namen (Groß/klein und
// Randleerzeichen egal, sonst exakte Schreibweise). { ok: false } = keine Verbindung.
async function lookupClassForName(name) {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/klasse_fuer_name', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ p_name: name })
    });
    if (!res.ok) return { ok: false };
    const data = await res.json();
    return { ok: true, klasse: (typeof data === 'string' && data.trim()) ? data.trim() : null };
  } catch (e) {
    return { ok: false };
  }
}

let nameLookupTimer = null;

function initNameHint() {
  const nameInput = document.getElementById('student_name');
  if (!nameInput) return;
  nameInput.addEventListener('input', () => {
    clearTimeout(nameLookupTimer);
    hideNameHint();
    nameLookupTimer = setTimeout(updateNameHint, 600);
  });
  if (nameInput.value.trim()) updateNameHint();
}

// Schon beim Tippen zeigen, ob der Name bekannt ist — so fällt ein Tippfehler vor „Weiter“ auf
async function updateNameHint() {
  if (!hasCourses()) return;
  const nameInput = document.getElementById('student_name');
  const name = nameInput.value.trim();
  if (name.split(/\s+/).length < 2) { hideNameHint(); return; }
  const r = await semesterForName(name);
  // Falls währenddessen weitergetippt wurde: Ergebnis verwerfen
  if (nameInput.value.trim() !== name) return;
  const hint = document.getElementById('name-hint');
  if (r.klasse) {
    hint.textContent = '✓ Willkommen zurück! Dein Semester: ' + r.klasse;
    hint.className = 'class-hint ok';
  } else if (r.offline) {
    hideNameHint();
  } else {
    hint.textContent = 'Diesen Namen kennen wir noch nicht. Neu hier? Dann gib unten den Code deines Semesters ein. Sonst prüfe die Schreibweise.';
    hint.className = 'class-hint info';
  }
}

function hideNameHint() {
  const hint = document.getElementById('name-hint');
  if (hint) hint.className = 'class-hint hidden';
}

function loadLastLogin() {
  try { return JSON.parse(localStorage.getItem(LAST_LOGIN_KEY)) || null; } catch (e) { return null; }
}

function prefillLastLogin() {
  const d = loadLastLogin();
  if (!d) return;
  if (d.name) document.getElementById('student_name').value = d.name;
  if (d.class_name && !hasCourses()) document.getElementById('class_name').value = d.class_name;
}

// ============= DIALOG (Ersatz für native confirm/alert) =============
// showDialog('Text') — nur OK-Button, wie alert.
// showDialog('Text', {okText, cancelText}) — mit Abbrechen, wie confirm.
// Gibt ein Promise<boolean> zurück.
function showDialog(text, opts) {
  const o = opts || {};
  return new Promise(resolve => {
    const backdrop = document.getElementById('modal-backdrop');
    const ok = document.getElementById('modal-ok');
    const cancel = document.getElementById('modal-cancel');
    document.getElementById('modal-text').textContent = text;
    ok.textContent = o.okText || 'OK';
    if (o.cancelText) {
      cancel.textContent = o.cancelText;
      cancel.classList.remove('hidden');
    } else {
      cancel.classList.add('hidden');
    }
    backdrop.classList.remove('hidden');
    const done = (v) => {
      backdrop.classList.add('hidden');
      ok.onclick = null;
      cancel.onclick = null;
      resolve(v);
    };
    ok.onclick = () => done(true);
    cancel.onclick = () => done(false);
    ok.focus();
  });
}

// ============= UTILS =============
function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
